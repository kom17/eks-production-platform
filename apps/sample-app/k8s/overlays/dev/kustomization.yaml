apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app
resources:
  - namespace.yaml
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/version: "initial" # CI updates this with the image tag
    includeTemplates: true

patches:
  - target:
      kind: Deployment
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: dev

# CI runs `kustomize edit set image` here after each successful build.
images:
  - name: sample-app
    newName: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/eks-platform-dev/sample-app
    newTag: initial
