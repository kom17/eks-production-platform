# -----------------------------------------------------------------------------
# App pipeline (CI) + GitOps handoff (CD)
#   PR   -> lint + unit tests, validate k8s manifests, build image, Trivy scan
#   main -> same, then push to ECR (OIDC, no keys) and commit the new image
#           tag to the dev overlay. ArgoCD sees the commit and rolls it out.
#
# CI never talks to the cluster: it only writes to Git. That's the GitOps
# "pull" model: the cluster needs no inbound CI credentials.
#
# Repo variables required: AWS_APP_CI_ROLE_ARN (terraform output app_ci_role_arn)
# -----------------------------------------------------------------------------
name: app-ci

on:
  pull_request:
    paths:
      - "apps/sample-app/**"
      - "gitops/**"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/sample-app/**"
      - "gitops/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  APP_DIR: apps/sample-app
  ECR_REPO_NAME: eks-platform-dev/sample-app
  OVERLAY: apps/sample-app/k8s/overlays/dev
  TRIVY_IMAGE: aquasec/trivy:0.76.1 # pinned image, not the GitHub action (see docs/decisions.md)
  KUBECONFORM_VERSION: v0.8.0
  K8S_VERSION: "1.35.0"

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src
      - run: pytest -q src

  validate-manifests:
    name: Validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
      - name: Render overlay and validate (incl. CRDs like ServiceMonitor)
        run: |
          kubectl kustomize "$OVERLAY" > rendered.yaml
          KC_ARGS=(-strict -summary -kubernetes-version "$K8S_VERSION"
            -schema-location default
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            -ignore-missing-schemas)
          kubeconform "${KC_ARGS[@]}" rendered.yaml
          kubeconform "${KC_ARGS[@]}" gitops/ docs/examples/

  build:
    name: Build & scan (push on main)
    needs: [test, validate-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      repository: ${{ steps.push.outputs.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=sample-app:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build "$APP_DIR" -t "${{ steps.meta.outputs.image }}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="$GITHUB_SHA"

      - name: Trivy vulnerability scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" \
            "$TRIVY_IMAGE" image --no-progress --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL "${{ steps.meta.outputs.image }}"

      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache" -v "$PWD:/out" \
            "$TRIVY_IMAGE" image --no-progress --format cyclonedx --output /out/sbom.cdx.json "${{ steps.meta.outputs.image }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.meta.outputs.tag }}
          path: sbom.cdx.json

      # ---------------- main only: push ----------------
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main' && vars.AWS_APP_CI_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_APP_CI_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_APP_CI_ROLE_ARN != ''
        id: push
        run: |
          REMOTE="${{ steps.ecr.outputs.registry }}/${ECR_REPO_NAME}"
          TAG="${{ steps.meta.outputs.tag }}"
          # Tags are IMMUTABLE in ECR: on a re-run, skip instead of failing
          if aws ecr describe-images --repository-name "$ECR_REPO_NAME" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already in ECR, skipping push"
          else
            docker tag "${{ steps.meta.outputs.image }}" "$REMOTE:$TAG"
            docker push "$REMOTE:$TAG"
          fi
          echo "repository=$REMOTE" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: GitOps bump (dev)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_APP_CI_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the new tag
    concurrency:
      group: gitops-bump-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Update image tag in dev overlay
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ needs.build.outputs.repository }}
        run: |
          # yq is preinstalled on GitHub-hosted Ubuntu runners
          yq -i '(.images[] | select(.name == "sample-app")) |= (.newName = strenv(REPO) | .newTag = strenv(TAG))' "$OVERLAY/kustomization.yaml"
          yq -i '.labels[0].pairs."app.kubernetes.io/version" = strenv(TAG)' "$OVERLAY/kustomization.yaml"
          git diff

      - name: Commit and push
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY/kustomization.yaml"
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "deploy(sample-app): dev -> $TAG [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
