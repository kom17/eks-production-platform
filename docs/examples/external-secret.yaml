# Example usage — create the secret first:
#   aws secretsmanager create-secret --name eks-platform-dev/sample-app \
#     --secret-string '{"API_KEY":"supersecret"}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-app
  namespace: sample-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: sample-app-secrets
  dataFrom:
    - extract:
        key: eks-platform-dev/sample-app
