# Lets any namespace sync secrets from AWS Secrets Manager via External Secrets.
# Auth uses the external-secrets controller's IRSA role (scoped to eks-platform-dev/*).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
