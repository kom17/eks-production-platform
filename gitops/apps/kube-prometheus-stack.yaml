apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  # Cascade delete: removing this Application deletes its resources (ALB, PVCs...)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # install CRDs before apps that use ServiceMonitor
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 72.0.0
    helm:
      valuesObject:
        grafana:
          adminPassword: change-me # move to External Secrets for real use
          nodeSelector: { workload: system }
          persistence:
            enabled: true
            storageClassName: gp3
            size: 5Gi
        prometheus:
          prometheusSpec:
            retention: 7d
            nodeSelector: { workload: system }
            # Pick up ServiceMonitors/PrometheusRules from every namespace
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
        alertmanager:
          alertmanagerSpec:
            nodeSelector: { workload: system }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs are too large for client-side apply
